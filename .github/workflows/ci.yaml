name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install development tools
        run: python -m pip install -r requirements-dev.txt
      - name: Test Azure workflow validation
        run: python -m unittest discover -s tests -v
      - name: Run pre-commit checks
        run: pre-commit run --all-files --show-diff-on-failure
      - name: Install Terragrunt
        shell: bash
        run: |
          version="$(cat .terragrunt-version)"
          release="https://github.com/gruntwork-io/terragrunt/releases/download/v${version}"
          curl --fail --silent --show-error --location "$release/terragrunt_linux_amd64" -o "$RUNNER_TEMP/terragrunt_linux_amd64"
          curl --fail --silent --show-error --location "$release/SHA256SUMS" -o "$RUNNER_TEMP/SHA256SUMS"
          cd "$RUNNER_TEMP"
          grep ' terragrunt_linux_amd64$' SHA256SUMS | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/bin"
          install -m 0755 terragrunt_linux_amd64 "$RUNNER_TEMP/bin/terragrunt"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Check Terragrunt configuration
        run: |
          terragrunt hcl format --check
          terragrunt hcl validate
      - name: Build TechDocs
        run: mkdocs build --strict
