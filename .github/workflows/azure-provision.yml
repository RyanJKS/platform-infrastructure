name: Azure provision
run-name: Azure provision ${{ inputs.action }} - ${{ inputs.scope }}/${{ inputs.category }}/${{ inputs.application }}/${{ inputs.unit }}
on:
  workflow_dispatch:
    inputs:
      subscription:
        description: Subscription folder (for example DEV-JKS)
        type: string
        required: true
      environment:
        description: Environment folder
        type: string
        default: dev
        required: true
      region:
        description: Azure region folder
        type: string
        default: uksouth
        required: true
      scope:
        description: Spoke folder (hub is currently a placeholder)
        type: string
        default: spoke-atlas
        required: true
      category:
        description: Unit category
        type: choice
        options: [platform, applications]
        required: true
      application:
        description: Application solution folder; leave empty for platform
        type: string
        required: false
      unit:
        description: Unit folder
        type: string
        required: true
      action:
        description: Plan only or plan then apply after environment approval
        type: choice
        options: [plan, apply]
        default: plan
        required: true

permissions:
  contents: read
  actions: read
  deployments: read
  id-token: write

jobs:
  unit:
    uses: ./.github/workflows/azure-unit.yml
    with:
      operation: provision
      subscription: ${{ inputs.subscription }}
      environment: ${{ inputs.environment }}
      region: ${{ inputs.region }}
      scope: ${{ inputs.scope }}
      category: ${{ inputs.category }}
      application: ${{ inputs.application }}
      unit: ${{ inputs.unit }}
      action: ${{ inputs.action }}
